<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Etiquetas QR - SGM-ITP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Estilos generales para la pantalla */
        body { background-color: #f4f6f9; padding: 20px; }
        .etiqueta {
            background: white;
            border: 1px dashed #ccc;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            width: 100%;
            break-inside: avoid; /* Evita que la etiqueta se corte a la mitad de la página */
        }
        .etiqueta img { max-width: 120px; margin-bottom: 10px; }
        .serie { font-family: monospace; font-weight: bold; font-size: 1.1rem; letter-spacing: 2px; }
        .edificio { font-size: 0.75rem; color: #666; text-transform: uppercase; }

        /* MAGIA: Estilos exclusivos para cuando se presiona Ctrl+P */
        @media print {
            body { background-color: white; padding: 0; margin: 0; }
            .no-print { display: none !important; } /* Oculta botones y menús */
            .etiqueta { 
                border: 1px solid #000; /* Borde sólido para recortar */
                border-radius: 0;
            }
            /* Configuración de la hoja */
            @page { margin: 1cm; }
        }
    </style>
</head>
<body>

    <div class="container mb-4 no-print text-center">
        <h3 class="mb-3">Generador de Etiquetas QR</h3>
        <button onclick="window.print()" class="btn btn-primary px-4 rounded-pill fw-bold me-2">
            Imprimir Etiquetas
        </button>
        <a href="{% url 'lista_equipos' %}" class="btn btn-outline-secondary px-4 rounded-pill">
            Regresar
        </a>
    </div>

    <div class="container-fluid">
        <div class="row row-cols-2 row-cols-md-4 row-cols-lg-5 g-3">
            {% for equipo in equipos %}
            <div class="col">
                <div class="etiqueta">
                    <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data={{ equipo.numero_serie }}" alt="QR">
                    <div class="serie">{{ equipo.numero_serie }}</div>
                    <div class="edificio">{{ equipo.edificio.nombre|truncatechars:20 }}</div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

</body>
</html>
